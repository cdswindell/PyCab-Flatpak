name: Auto-publish PyCab for PyTrain releases

# Cross-repository workflow_run is not supported by GitHub Actions.
# PyLegacy dispatches after both PyPI uploads; polling recovers missed events.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [pytrain-release]

permissions:
  contents: write
  actions: write

concurrency:
  group: pycab-automatic-production-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
          architecture: x64

      - name: Find latest published PyTrain version and check PyPI
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --tags
          # Dispatch events target the exact PyLegacy version; scheduled runs discover latest.
          EVENT_VERSION="${{ github.event.client_payload.version || '' }}"
          if [[ -n "$EVENT_VERSION" ]]; then
            [[ "$EVENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid dispatched version: $EVENT_VERSION"; exit 1; }
            VERSION="$EVENT_VERSION"
          else
            VERSION="$(gh api 'repos/cdswindell/PyLegacy/git/matching-refs/tags/' --paginate --jq '.[].ref' |
            sed -nE 's@^refs/tags/([0-9]+\.[0-9]+\.[0-9]+)$@\1@p' |
            sort -V | tail -n 1)"
          fi
          [[ -n "$VERSION" ]] || { echo "::error::No numeric PyLegacy release tags"; exit 1; }
          echo "PyLegacy version: $VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "PyCab v$VERSION already tagged; nothing to publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Wait for both independent PyPI publishing jobs, including their actual files.
          # Missing packages are expected while PyLegacy release.yml is running.
          for package in pytrain-ogr pytrain-ogr-deck; do
            if ! python - "$package" "$VERSION" <<'PY'
          import json, sys, urllib.error, urllib.request
          package, version = sys.argv[1:]
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/{version}/json", timeout=20) as response:
                  data = json.load(response)
              files = data.get("urls", [])
              if data["info"]["version"] != version or not any(not f.get("yanked", False) for f in files):
                  sys.exit(1)
          except (urllib.error.URLError, KeyError, ValueError):
              sys.exit(1)
          PY
            then
              echo "$package==$VERSION is not published yet; next scheduled run will retry."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Generate production dependency lock
        if: steps.version.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/pycab-release-lock
          # PyPI's JSON API can expose a release before the package index used by pip.
          # Retry briefly to allow index/CDN propagation; the scheduled run remains a fallback.
          for attempt in {1..12}; do
            if /tmp/pycab-release-lock/bin/python -m pip install --disable-pip-version-check --no-cache-dir "pytrain-ogr-deck==$VERSION"; then
              break
            fi
            if (( attempt == 12 )); then
              echo "::error::pytrain-ogr-deck==$VERSION remains unavailable to pip after retries"
              exit 1
            fi
            echo "PyPI package index not ready (attempt $attempt/12); retrying in 15 seconds..."
            sleep 15
          done
          /tmp/pycab-release-lock/bin/python -m pip check
          {
            echo "# Exact Python environment resolved for PyCab / pytrain-ogr-deck==$VERSION."
            echo "# Generated by GitHub Actions on Linux/x86_64 with Python 3.14.8."
            echo "# Regenerate with ./update-lock.sh <PyTrain-version>."
            /tmp/pycab-release-lock/bin/python -m pip freeze | LC_ALL=C sort -f
          } > requirements-lock.txt
          grep -Fxq "pytrain-ogr-deck==$VERSION" requirements-lock.txt

      - name: Commit lock and tag release
        if: steps.version.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Refuse to tag if master moved while resolving dependencies.
          git fetch origin master --tags
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/master)" ]] ||
            { echo "::error::master changed during release; retry on next scheduled run."; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Release tag already exists; skipping."
            exit 0
          fi
          if ! git diff --quiet -- requirements-lock.txt; then
            git add requirements-lock.txt
            git commit -m "Lock PyCab dependencies for PyTrain $VERSION"
            git push origin HEAD:master
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          # Tags pushed with GITHUB_TOKEN do not trigger push workflows.
          # Dispatch release.yml explicitly against the new tag.
          gh workflow run release.yml --ref "v$VERSION"
          echo "Pushed PyCab v$VERSION and dispatched release.yml."
