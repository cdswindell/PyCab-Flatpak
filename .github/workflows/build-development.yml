name: Build Development Flatpak

on:
  workflow_dispatch:
    inputs:
      pycab_ref:
        description: "PyCab-Flatpak branch, tag, or commit to build"
        required: true
        default: "master"
        type: string
      pylegacy_ref:
        description: "PyLegacy branch, tag, or commit to package"
        required: true
        default: "master"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  development:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PyCab Flatpak source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.pycab_ref }}
          persist-credentials: false

      - name: Checkout PyLegacy source
        uses: actions/checkout@v5
        with:
          repository: cdswindell/PyLegacy
          ref: ${{ inputs.pylegacy_ref }}
          path: pylegacy-source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Compute development tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from urllib.request import Request, urlopen

          def api(path):
              request = Request(
                  f"https://api.github.com/{path}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "PyCab-development-builder",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          tags = subprocess.check_output(
              ["git", "-C", "pylegacy-source", "tag", "--list"], text=True
          ).splitlines()
          versions = [tuple(map(int, tag.split("."))) for tag in tags if re.fullmatch(r"\d+\.\d+\.\d+", tag)]
          if not versions:
              raise SystemExit("No numeric PyLegacy release tags found")
          version = ".".join(map(str, max(versions)))
          release = api(f"repos/{os.environ['GH_REPOSITORY']}/releases/latest")
          published = release["tag_name"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)(?:-(\d+))?", published)
          if not match:
              raise SystemExit(f"Unexpected production release tag: {published}")
          published_version = tuple(map(int, match.group(1).split(".")))
          current_version = tuple(map(int, version.split(".")))
          if published_version > current_version:
              raise SystemExit("Latest production PyCab release is newer than checked-out PyLegacy tags")
          revision = int(match.group(2) or 0) if published_version == current_version else 0
          base = f"v{version}" + (f"-{revision}" if revision else "")
          # Count development workflow runs since this production release.
          # For an as-yet unpublished PyTrain version, count runs since its tag.
          if published_version == current_version:
              cutoff = release["published_at"]
          else:
              cutoff = subprocess.check_output(
                  ["git", "-C", "pylegacy-source", "log", "-1", "--format=%cI", version], text=True
              ).strip()
          run_id = int(os.environ["GH_RUN_ID"])
          count = 0
          page = 1
          while True:
              data = api(
                  f"repos/{os.environ['GH_REPOSITORY']}/actions/workflows/"
                  f"build-development.yml/runs?event=workflow_dispatch&per_page=100&page={page}"
              )
              runs = data["workflow_runs"]
              for run in runs:
                  if run["created_at"] >= cutoff and run["id"] <= run_id:
                      count += 1
              if len(runs) < 100 or runs[-1]["created_at"] < cutoff:
                  break
              page += 1
          if count < 1:
              raise SystemExit("Could not determine development run sequence")
          tag = f"{base}-dev.{count}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"PYCAB_RELEASE_TAG={tag}\n")
              output.write(
                  "PYCAB_PYLEGACY_COMMIT="
                  + subprocess.check_output(
                      ["git", "-C", "pylegacy-source", "rev-parse", "HEAD"], text=True
                  ).strip()
                  + "\n"
              )
          print(f"Development tag: {tag}")
          PY

      - name: Build development Deck wheel
        run: |
          python -m pip install --upgrade build setuptools-scm
          mkdir -p dev-wheels
          (cd pylegacy-source && python scripts/build_deck.py --allow-local-version -o ../dev-wheels)
          ls -lh dev-wheels/*.whl
          python - <<'PY'
          from pathlib import Path
          from packaging.version import Version
          wheels = list(Path("dev-wheels").glob("pytrain_ogr_deck-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one development wheel, found {len(wheels)}")
          version = Version(wheels[0].name.split("-")[1])
          if version.release[:2] == (0, 0) or len(version.release) < 3:
              raise SystemExit(f"Invalid development wheel version: {version}. Check git tags and checkout depth.")
          print(f"Validated development wheel version: {version}")
          PY

      # Share cache keys with release.yml so development and release builds
      # can reuse the same Freedesktop SDK/runtime installation.
      - name: Restore Flatpak SDK and runtime
        uses: actions/cache@v5
        with:
          path: ~/.local/share/flatpak
          key: flatpak-sdk-ubuntu2404-x86_64-26.08-v1

      - name: Install Flatpak build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          if flatpak info --user org.freedesktop.Platform//26.08 >/dev/null 2>&1 &&
             flatpak info --user org.freedesktop.Sdk//26.08 >/dev/null 2>&1; then
            echo "Flatpak SDK and runtime restored from cache."
          else
            flatpak install --user -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08
          fi

      # Reuse downloaded sources and module builds across release and dev runs.
      # The run-specific key permits saving refreshed caches after each build.
      - name: Restore Flatpak Builder cache
        uses: actions/cache@v5
        with:
          path: .flatpak-builder
          key: flatpak-builder-ubuntu2404-x86_64-${{ hashFiles('io.github.cdswindell.PyCab.yml') }}-${{ github.run_id }}
          restore-keys: |
            flatpak-builder-ubuntu2404-x86_64-${{ hashFiles('io.github.cdswindell.PyCab.yml') }}-
            flatpak-builder-ubuntu2404-x86_64-

      - name: Build development Flatpak bundle
        env:
          PYCAB_PREBUILT_WHEEL: "1"
        run: bash build-release.sh

      - name: Upload development bundle
        uses: actions/upload-artifact@v6
        with:
          name: PyCab-development-flatpak
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/PyCab.flatpak
            dist/PyCab.flatpak.sha256
