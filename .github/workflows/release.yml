name: Build Flatpak Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set PyTrain version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building PyCab with pytrain-ogr-deck==$VERSION"
          sed -i -E "s/(pytrain-ogr-deck==)[0-9]+\.[0-9]+\.[0-9]+/\1$VERSION/" io.github.cdswindell.PyCab.yml
          grep "pytrain-ogr-deck==" io.github.cdswindell.PyCab.yml

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Build bundle
        run: bash build-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyCab-flatpak
          path: |
            dist/PyCab.flatpak
            dist/PyCab.flatpak.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PyCab.flatpak
            dist/PyCab.flatpak.sha256
