name: Build Flatpak Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate release lock and PyPI package
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${RELEASE_VERSION%%-*}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?$ ]]; then
            echo "::error::Unsupported PyCab release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          LOCKED_VERSION="$(sed -n 's/^pytrain-ogr-deck==//p' requirements-lock.txt)"
          if [[ -z "$LOCKED_VERSION" ]]; then
            echo "::error::requirements-lock.txt does not contain pytrain-ogr-deck."
            exit 1
          fi
          if [[ "$LOCKED_VERSION" != "$VERSION" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match locked pytrain-ogr-deck==$LOCKED_VERSION."
            echo "::error::Run ./update-lock.sh $VERSION, test the resulting Flatpak, commit the lock, then tag the release."
            exit 1
          fi
          PACKAGE_URL="https://pypi.org/pypi/pytrain-ogr-deck/$VERSION/json"
          echo "Checking pytrain-ogr-deck==$VERSION on PyPI..."
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$PACKAGE_URL" >/dev/null; then
              echo "Lock matches tag and pytrain-ogr-deck==$VERSION is available on PyPI."
              exit 0
            fi
            if [[ $attempt -lt 12 ]]; then
              echo "Not available yet; retrying in 10 seconds ($attempt/12)..."
              sleep 10
            fi
          done
          echo "::error::pytrain-ogr-deck==$VERSION is not available on PyPI."
          exit 1

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Build bundle
        run: bash build-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyCab-flatpak
          path: |
            dist/PyCab.flatpak
            dist/PyCab.flatpak.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PyCab.flatpak
            dist/PyCab.flatpak.sha256
