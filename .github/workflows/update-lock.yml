name: Generate Python Dependency Lock
run-name: Lock ${{ inputs.version }} / ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published pytrain-ogr-deck version (e.g. 2.12.1)"
        required: true
        type: string
      request_id:
        description: "Optional unique identifier for release-script dispatch"
        required: false
        type: string

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.8"
          architecture: x64

      - name: Resolve Linux x86_64 dependencies
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/pycab-lock-venv
          /tmp/pycab-lock-venv/bin/python -m pip install --disable-pip-version-check "pytrain-ogr-deck==$VERSION"
          /tmp/pycab-lock-venv/bin/python -m pip check
          {
            echo "# Exact Python environment resolved for PyCab / pytrain-ogr-deck==$VERSION."
            echo "# Generated by GitHub Actions on Linux/x86_64 with Python 3.14.8."
            echo "# Regenerate with ./update-lock.sh <PyTrain-version>."
            /tmp/pycab-lock-venv/bin/python -m pip freeze | LC_ALL=C sort -f
          } > requirements-lock.txt
          grep -Fx "pytrain-ogr-deck==$VERSION" requirements-lock.txt

      - uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements-lock.txt
          if-no-files-found: error
