app-id: io.github.cdswindell.PyCab
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: pycab-flatpak

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=all

build-options:
  env:
    PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/share/pkgconfig
    LD_LIBRARY_PATH: /app/lib

modules:
  - name: tcl
    buildsystem: autotools
    subdir: unix
    post-install:
      - chmod 755 /app/lib/libtcl*.so
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/tcl/Tcl/8.6.18/tcl8.6.18-src.tar.gz
        sha256: 14f9af32b1767ff718477a8f974ad03c34341097e6b43f4ce54644ee974e268e

  - name: tk
    buildsystem: autotools
    subdir: unix
    config-opts:
      - --with-tcl=/app/lib
      - --enable-xft
    post-install:
      - chmod 755 /app/lib/libtk*.so
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/tcl/Tcl/8.6.18/tk8.6.18-src.tar.gz
        sha256: 95cd528a80f5e4bdb557af9b14a7197d6860793a3894e25e7c9fad2ed05d4c3c

  - name: python
    buildsystem: autotools
    config-opts:
      - --prefix=/app
      - --enable-shared
      - --with-ensurepip=install
    build-options:
      env:
        CPPFLAGS: -I/app/include
        LDFLAGS: -L/app/lib
        LD_LIBRARY_PATH: /app/lib
        PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/share/pkgconfig
    post-install:
      - /app/bin/python3 -c "import tkinter; print('Tk', tkinter.TkVersion)"
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.14.8/Python-3.14.8.tar.xz
        sha256: c2215904f02b175596dc49351585104f4bc20341e1c47378b26a2c274360ce73

  - name: pycab
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - /app/bin/python3 -m pip install --prefix=/app --no-cache-dir --no-deps -r requirements-lock.txt
      - /app/bin/python3 -c "from importlib.metadata import version; print('PyCab PyTrain version:', version('pytrain-ogr-deck'))"
      # Install packaged Digital Dream fonts into Flatpak's fontconfig search path.
      # Fail rather than silently ship a UI with substituted fonts.
      - |
        /app/bin/python3 - <<'PY'
        from pathlib import Path
        from shutil import copy2
        import pytrain.gui

        source = Path(pytrain.gui.__file__).resolve().parent / "fonts"
        fonts = sorted(p for p in source.rglob("*.ttf") if "digital" in p.stem.lower() and "dream" in p.stem.lower())
        if not fonts:
            raise RuntimeError(f"Digital Dream font not found in {source}")
        destination = Path("/app/share/fonts/truetype/pycab")
        destination.mkdir(parents=True, exist_ok=True)
        for font in fonts:
            target = destination / font.name
            copy2(font, target)
            print(f"Installed font: {target}")
        PY
      - fc-cache -f /app/share/fonts
      - fc-list : family | grep -i 'digital.*dream'
      # Install PyLegacy's existing PyCab artwork as standard Flatpak icons.
      - |
        /app/bin/python3 - <<'PY'
        from importlib.resources import as_file, files
        from pathlib import Path
        from shutil import copy2
        from PIL import Image
        from pytrain.gui import images

        source = files(images)
        for name in ("en-US_pycab_small.png", "en-US_pycab_large.png"):
            resource = source.joinpath(name)
            if not resource.is_file():
                raise RuntimeError(f"Missing packaged PyCab icon: {name}")
            with as_file(resource) as path:
                with Image.open(path) as icon:
                    width, height = icon.size
                    if width != height:
                        raise RuntimeError(f"PyCab icon must be square: {name} ({width}x{height})")
                    size = width
                destination = Path(f"/app/share/icons/hicolor/{size}x{size}/apps/io.github.cdswindell.PyCab.png")
                destination.parent.mkdir(parents=True, exist_ok=True)
                copy2(path, destination)
                print(f"Installed PyCab icon: {destination}")
        PY
      - install -Dm755 pycab-flatpak /app/bin/pycab-flatpak
      - install -Dm644 buttons.py /app/share/pycab/buttons.py
      - install -Dm644 io.github.cdswindell.PyCab.desktop /app/share/applications/io.github.cdswindell.PyCab.desktop
    sources:
      - type: dir
        path: .
